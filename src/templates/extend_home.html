<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
<script src="{% static 'lib/bootstrap/dist/js/bootstrap.min.js' %}"></script>
<script>
$.AdminLTE = $.AdminLTE || {};
$.AdminLTE.iframe = null; // Disable IFrame component
$.fn.IFrame = function(method) {
  if (method === 'dispose') {
    return this; // Allow dispose calls
  }
  // Prevent initialization that causes null errors
  return this;
};
</script>
<script src="{% static 'lib/admin-lte/dist/js/adminlte.min.js' %}"></script>
<script src="{% static 'lib/chart.js/dist/chart.min.js' %}"></script>
<script>


    /**
     * 生成随机RGB颜色字符串，例如：rgb(123,123,123)
     * @returns {string}
     */
    function randomRGB() {
        return 'rgb(' + randomColorArray().join(',') + ')'
    }

    // 生成随机RGBA字符串，例如：rgba(123,123,123,0.2)
    function randomRGBA(a) {
        return convertRGBA(this.randomColorArray(), a)
    }

    // RGB数组转换成RGBA字符串
    function convertRGBA(rgbArray, a) {
        let color = Array.from(rgbArray)
        color.push(a)
        return 'rgba(' + color.join(',') + ')'
    }

    function randomColorArray(status) {
        if (status === '待机中') {return [255,215,0]}
        else if (status === '作业中') {return [0,128,0]}
        else if (status === '故障中') {return [178,34,34]}
        else if (status === '离线中') {return [123,123,123]}
    }

    async function fetchApiData() {
        try {
            // Check network connectivity
            if (!navigator.onLine) {
                throw new Error('网络连接不可用');
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout

            const response = await fetch('/api/amfui/cell/cncs', {
                signal: controller.signal,
                headers: {
                    'Content-Type': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });

            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();

            if (result && result.data) {
                initChart(result.data);
            } else {
                throw new Error('API 返回数据格式错误');
            }

        } catch (error) {
            console.error('Dashboard 加载错误:', error);
            let errorMessage = '数据加载失败，请检查网络连接';

            if (error.name === 'AbortError') {
                errorMessage = '请求超时，请重试';
            } else if (error.message.includes('网络')) {
                errorMessage = error.message;
            }

            // Try to show error in chart area
            initChart({ cells: {}, msgs: { error: errorMessage } });
        }
    }

    function addAmsgHref(text, msgsElem)
    {
        let listItem = document.createElement('a');
        listItem.href = '#';
        listItem.className = 'list-group-item list-group-item-action';
        listItem.textContent = DOMPurify.sanitize(text, { ALLOWED_TAGS: ['#text'] }); // Sanitize text only
        msgsElem.appendChild(listItem);
    }

    function initChart(exampleData) {
        try {
            let chartElem = document.getElementById('myChart2');
            let msgsElem = document.getElementById('msg_list');

            if (!chartElem || !msgsElem) {
                console.error('Chart elements not found: chartElem=', chartElem, 'msgsElem=', msgsElem);
                return;
            }

            chartElem.innerHTML = '';

            // Destroy previous chart to avoid reuse error
            if (window.currentChart && typeof window.currentChart.destroy === 'function') {
                try {
                    window.currentChart.destroy();
                } catch (destroyError) {
                    console.warn('Error destroying previous chart:', destroyError);
                }
            }

            // Validate data structure
            if (!exampleData || typeof exampleData !== 'object') {
                exampleData = { cells: {}, msgs: { error: '无效数据格式' } };
            }

            if (!exampleData.cells) exampleData.cells = {};
            if (!exampleData.msgs) exampleData.msgs = {};
        let labels = []
        let values = []
        let backgroundColors = []
        let borderColors = []
        for (const key in exampleData.cells)
        {
            labels.push(key)
            values.push(exampleData.cells[key])
            let color = randomColorArray(key)
            backgroundColors.push(convertRGBA(color, 0.9))
            borderColors.push(convertRGBA(color, 1))
        }
        let data = {
            labels: labels,
            datasets: [{
                label: '# of Votes',
                data: values,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1
            }]
        }
        let config = {
            type: 'doughnut',
            data: data,
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'chartArea',
                    },
                }
            }
        }
        msgsElem.innerHTML = '';
        addAmsgHref('最新异常记录', msgsElem);
        
        for (const key in exampleData.msgs) {
            addAmsgHref(`${exampleData.msgs[key]}`, msgsElem);
        }
            window.currentChart = new Chart(chartElem, config)
            window.currentChart.resize(null, 500)

        } catch (chartError) {
            console.error('Chart initialization error:', chartError);
            if (msgsElem) {
                msgsElem.innerHTML = '<div class="error">图表加载失败</div>';
            }
        }
    }

    fetchApiData()
    setInterval(fetchApiData, 30 * 1000);
</script>

</body>
</html>
