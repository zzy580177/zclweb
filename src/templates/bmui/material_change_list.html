{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/bmui.css' %}">

<style>
    #material-details {
        width: 100%; /* 设置表格宽度为容器的 100% */
        border-collapse: collapse; /* 合并边框 */
    }

    #material-details th, #material-details td {
        padding: 8px; /* 设置单元格内边距 */
        text-align: left; /* 左对齐内容 */
        border: 1px solid #ddd; /* 添加边框 */
        word-wrap: break-word; /* 自动换行 */
    }

    #material-details th {
        background-color: #f4f4f4; /* 设置表头背景色 */
    }

    #material-details tbody tr:hover {
        background-color: #f9f9f9; /* 鼠标悬停时高亮行 */
    }

    #material-details input {
        width: 100%; /* 输入框宽度占满单元格 */
        box-sizing: border-box; /* 包括内边距和边框在宽度内 */
    }
</style>

<div class="container">
    <div id='form'>
        {% csrf_token %}
        <div>
            <h3>新增/修改物料</h3>
            <table id="material-details">
            </table>
        </div>
        <div>
            <button type="submit" id="submit">提交</button>
            <button type="button" id="add-row">+ 添加</button>
            <button type="button" id="quick-fill">⛶ 快速填报</button>
        </div>
    </div>

    <!-- 快速填报模态框 -->
    <div id="quick-fill-modal" class="modal">
        <div class="modal-header">
            <h2>快速填报</h2>
            <div class="modal-controls">
                <button id="maximize-modal" class="modal-button" style="margin-right: 10px;">⛶</button>
                <button id="close-import-modal" class="modal-button">✖</button>
            </div>
        </div>
        <div class="modal-body">
            <label for="fill-mode" class="modal-label">填报模式：</label>
            <select id="fill-mode" class="modal-select">
                <option value="new">新增记录</option>
                <option value="edit">编辑记录</option>
            </select>
            <p class="modal-description">
                可将 Excel 内容粘贴到表格中，也可直接编辑表格内容，支持使用复制、粘贴、撤销、删除快捷键。
            </p>
            <div class="modal-table-container">
                <table id="editable-table" class="modal-table"></table>
            </div>
            <div class="modal-footer">
                <button type="submit" id="submit-import" class="modal-action-button">保存</button>
            </div>
        </div>
    </div>
    <!-- 模态框遮罩层 -->
    <div id="modal-overlay" class="modal-overlay"></div>


    {{ block.super }}


</div>

<script type="module">
    import {renderTableAndLoadData, handleTableEvent, randerInputTable} from "{% static 'js/eventAction.js' %}";
    import {API_CONFIG} from "{% static 'js/apiConfig.js' %}";
    import { 
        //addRow,
        //enableRowDeletion,          
        switchOverlay, 
        initializeTableRows, 
        toggleMaximizeModal, 
        enableTablePaste,
        bindQuickFillSave,  
        getTableData,
        //styleCell, 
        //fetchParentMaterials,
        //updataInputSelectOptions,
        setupAutoFill,
        } from "{% static 'js/bmui.js' %}";

    document.addEventListener("DOMContentLoaded", function () {
        const quickFillButton = document.getElementById("quick-fill");
        const importModal = document.getElementById("quick-fill-modal");
        const importoverlay = document.getElementById("modal-overlay");
        const editableTable = document.querySelector("#editable-table");

        const mdTable = document.querySelector('#material-details')
        mdTable.dataset.headers = JSON.stringify(['物料序号','物料名称','型号','物料编号','物料组','助记码', '中间件', '单位', '来源','备注','操作'])
        mdTable.dataset.keys = JSON.stringify(['FId','FName','FModel','FNumber','FGroup','FHelpCode','FParent','FUnit','FSource','FDescription','删除'])
        mdTable.dataset.inputs = JSON.stringify(['FId','FName','FNumber','FHelpCode','FModel','FParent','FSource','FDescription'])
        mdTable.dataset.selects = JSON.stringify({
            FGroup:API_CONFIG['bmui'].material_group,
            FUnit:API_CONFIG['bmui'].attribute})
        mdTable.dataset.buttons = JSON.stringify(['删除'])
        mdTable.dataset.uniqKeys = JSON.stringify(['FId','FModel','FNumber'])
        mdTable.dataset.require = JSON.stringify(['FId','FName','FGroup_id','FNumber','FUnit'])
        mdTable.dataset.url = JSON.stringify(API_CONFIG['bmui'].material)
        randerInputTable(mdTable);
        handleTableEvent(document.querySelector('#form'));



        // 打开快速填报模态框
        const tableHead = {{ tableHead|safe }};
        quickFillButton.addEventListener("click", function () {
            editableTable.innerHTML = ""; 
            switchOverlay(importoverlay, importModal, true);            
            initializeTableRows(editableTable, 6, tableHead);
        });
        // 关闭快速填报模态框        
        const closeModalButton = document.getElementById("close-import-modal");
        closeModalButton.addEventListener("click", function () {
            switchOverlay(importoverlay, importModal, false);
        });      
        // need fix
        toggleMaximizeModal(importModal, document.getElementById("maximize-modal"), editableTable);

        // 启用表格粘贴功能
        enableTablePaste(editableTable, 9);

        // 绑定点击事件
        const submitImportButton = document.querySelector("#submit-import");
        const csrfToken = "{{ csrf_token }}";
        bindQuickFillSave(submitImportButton, 
        "{% url 'admin:bmui_material_addlist' %}", csrfToken, 
        () => {
            return {materials: getTableData(editableTable)}; },
        (result) => {
            // 保存成功后的操作
            switchOverlay(importoverlay, importModal, false);
            alert("保存成功！");},
        (error) => {
            // 保存失败后的操作
            console.error("保存失败回调：", error);
            alert("保存失败，请检查网络或数据！");
        });
        // Setup auto-fill functionality
        const tableBody = document.querySelector("#material-details tbody");
        setupAutoFill(tableBody, "{% url 'admin:bmui_material_lookup' %}", "{{ csrf_token }}");
    });
</script>
{% endblock %}
