<style>
    /* CNC工艺设计样式 */
    .cnc-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100%;
    }
    .cnc-modal-header-title {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
    }
    .cnc-modal-header-buttons {
        display: flex;
        gap: 8px;
    }
    .cnc-process-card {
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        margin-bottom: 15px;
        background: white;
    }
    .cnc-process-header {
        background: #f5f7fa;
        padding: 12px 15px;
        border-bottom: 1px solid #ebeef5;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .cnc-process-body {
        padding: 15px;
    }
    .cnc-step-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 6px;
        padding: 6px;
        background: #f8f9fa;
        border-radius: 6px;
        border: 1px solid #e9ecef;
    }
    .cnc-step-number {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #409EFF;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 11px;
        margin-right: 8px;
        flex-shrink: 0;
        margin-top: 2px;
    }
    .cnc-step-content {
        flex: 1;
        min-width: 0; /* 允许flex shrink */
    }
    .cnc-machining-params {
        display: grid;
        gap: 6px;
        margin-top: 6px;
    }
    /* 根据参数数量动态设置列数 */
    .cnc-machining-params.param-count-1 {
        grid-template-columns: 1fr;
    }
    .cnc-machining-params.param-count-2 {
        grid-template-columns: repeat(2, 1fr);
        max-width: fit-content;
        margin: 6px auto 0;
    }
    .cnc-machining-params.param-count-3 {
        grid-template-columns: repeat(3, minmax(90px, 1fr));
    }
    .cnc-machining-params.param-count-4 {
        grid-template-columns: repeat(2, minmax(100px, 1fr));
    }
    .cnc-machining-params.param-count-5,
    .cnc-machining-params.param-count-6 {
        grid-template-columns: repeat(3, minmax(80px, 1fr));
    }
    .cnc-machining-params.param-count-default {
        grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
    }
    .cnc-machining-param-item {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }
    .cnc-machining-param-item input {
        width: 100%;
        padding: 3px 5px;
        border: 1px solid #dcdfe6;
        border-radius: 3px;
        font-size: 11px;
        height: 26px;
        box-sizing: border-box;
        transition: border-color 0.2s ease;
    }
    .cnc-machining-param-item input:focus {
        outline: none;
        border-color: #409EFF;
        box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1);
    }
    .cnc-machining-param-item label {
        font-size: 10px;
        color: #666;
        margin: 0;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cnc-step-actions {
        display: flex;
        gap: 5px;
    }
    input.unvalid, select.unvalid {
        border-color: #ff4949;
        background-color: #fdf2f2;
        box-shadow: 0 0 0 1px rgba(255, 73, 73, 0.2);
    }

</style>

<!-- CNC工艺设计模态框 -->
<div id="cnc-design-modal" class="modal">
    <div class="el-dialog__header cnc-modal-header" style="height: 5vh;">
        <h2 class="cnc-modal-header-title">CNC工艺设计</h2>
        <div class="modal-controls" style="display: flex; align-items: center; gap: 8px;">
            <div class="el-button-group btn-group" size="small">
                <button type="button" id="maximize-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                    ⛶</button>
                <button type="button" id="switch-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                    <span class="el-icon-switch-button"></span>
                </button>
            </div>
        </div>
    </div>
    <hr style="border-bottom:1px solid #e4e7ed; margin: 12px 0; height: 0;" aria-hidden="true">
    <div class="el-dialog__body" style="max-height: 65vh; overflow-y: auto; padding: 20px;">
        <!-- 基础信息展示 -->
        <div id="cnc-basic-info" style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px;">
            <h3 style="margin: 0 0 10px 0; color: #409EFF;">基础信息</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                <div><strong>订单号:</strong> <span id="cnc-order-id"></span></div>
                <div><strong>零件编码:</strong> <span id="cnc-material-number"></span></div>
                <div><strong>零件型号:</strong> <span id="cnc-material-model"></span></div>
                <div><strong>零件版本:</strong> <span id="cnc-part-version"></span></div>
                <div><strong>工艺版本:</strong> <span id="cnc-process-version"></span></div>
            </div>
        </div>

        <!-- CNC工序卡管理 -->
        <div style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #409EFF;" class="cnc-card-header-title">CNC工序卡</h3>
                <div class="el-button-group" style="display: flex; gap: 10px;">
                    <button id="fast-add-cnc-process" class="el-button el-button--info el-button--small">
                        <i class="el-icon-document-copy"></i> 快速添加
                    </button>
                    <button id="add-cnc-process" class="el-button el-button--primary el-button--small">
                        <i class="el-icon-plus"></i> 添加工序卡
                    </button>
                </div>
            </div>
            <div id="cnc-processes-container">
                <!-- 动态添加的工序卡 -->
            </div>
        </div>

        <!-- 操作按钮 -->
        <div style="text-align: right; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ebeef5;">
            <button class="el-button el-button--small" id="cancel-cnc-design">取消</button>
            <button class="el-button el-button--primary el-button--small" id="save-cnc-design">保存设计</button>
        </div>
    </div>
</div>
<div id="cnc-design-modal-overlay" class="modal-overlay"></div>
