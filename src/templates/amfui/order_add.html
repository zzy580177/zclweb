{% extends "admin/base_site.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <div style="width: 50%; text-align: center;">
        <h1>创建新订单</h1>
        <form method="post" style="display: inline-block; text-align: left;">
            {% csrf_token %}
            <div style="margin-bottom: 10px; display: flex; align-items: center;">
                <label for="OrderId" style="width: 100px; text-align: right; margin-right: 10px;">订单编号:</label>
                <input type="text" id="OrderId" name="OrderId" required style="flex: 1;">
            </div>
            <div style="margin-bottom: 10px; display: flex; align-items: center;">
                <label for="Product_id" style="width: 100px; text-align: right; margin-right: 10px;">产品编号:</label>
                <input type="text" id="Product_id" name="Product_id" required style="flex: 1;">
            </div>
            <div style="margin-bottom: 10px; display: flex; align-items: center;">
                <label for="ReqParts" style="width: 100px; text-align: right; margin-right: 10px;">需求数量:</label>
                <input type="number" id="ReqParts" name="ReqParts" required style="flex: 1;" min="1">
            </div>
            <div style="margin-bottom: 10px; display: flex; align-items: center;">
                <label for="Status" style="width: 100px; text-align: right; margin-right: 10px;">状态:</label>
                <input type="text" id="Status" name="Status" value="未就绪" required style="flex: 1;" disabled>
            </div>
            <div style="text-align: center;">
                <button type="submit" class="button" style="font-weight: bold; color: black; background-color: rgb(176, 222, 176); font-size: 14px; padding: 8px 16px;">确认</button>
                <a class="button" style="font-weight: bold; color: black; background-color: rgb(189, 198, 189); font-size: 14px; padding: 8px 16px; margin-left: 20px;" href="/amf/amfui/order/">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
