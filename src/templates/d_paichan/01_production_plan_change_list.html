{% extends "admin/change_list.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'admin/simpleui-x/elementui/theme-chalk/index.css' %}">
<link rel="stylesheet" href="{% static 'css/bmui.css' %}">
<script src="{% static 'admin/simpleui-x/elementui/index.js' %}"></script>
<style>
    .el-descriptions__card,
    .el-descriptions__card td,
    .el-descriptions__card th {
        border: none !important;
        box-shadow: none !important;
    }
    .el-descriptions__table {
        table-layout: auto !important;
        width: 100% !important;
    }

    .el-descriptions-item__label { font-weight: bold;}
    .el-descriptions__title { color: #2f7deb !important; }

    .transfer-container {
        display: flex;
        width: 100%;
    }
    .transfer-panel {
        flex: 0 0 48%;  /* 固定40%宽度 */
        min-width: 0;   /* 防止内容溢出 */
    }
    .sort-buttons {
        flex: 0 0 4%;  /* 固定20%宽度 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
    }
    .step-item {
        -webkit-user-select: text;  /* Chrome/Safari */
        -moz-user-select: text;     /* Firefox */
        -ms-user-select: text;      /* IE10+ */
        user-select: text;          /* 标准语法 */
        cursor: default;            /* 保持默认指针样式 */
        padding: 8px 12px;          /* 增加点击区域 */
    }
    .step-item:hover {
        background-color: #f5f7fa;  /* 悬停背景色 */
    }
    .step-item:active {
        background-color: #e4e7ed;  /* 点击态背景色 */
    }
    .btn-active {
        background-color: #409EFF;
        color: white;
    }

    .gongyi-tabs {
        width: 100%;
        margin-top: 10px;
    }
    .gongyi-tabs .el-tab-pane {
        padding: 10px 0;
    }
    .el-descriptions--sub {
        margin: 0;
    }

    .custom-tabs .tab-header {
        display: flex;
        margin-bottom: 10px;
        border-bottom: 1px solid #ddd;
    }
    .custom-tabs .tab-item {
        padding: 8px 16px;
        cursor: pointer;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-bottom: none;
        margin-right: 2px;
        border-radius: 4px 4px 0 0;
        transition: background-color 0.2s ease;
    }
    .custom-tabs .tab-item:hover {
        background: #e8e8e8;
    }
    .custom-tabs .tab-item.active {
        background: #409EFF;
        color: white;
        border-color: #409EFF;
    }
    .custom-tabs .tab-content .tab-pane {
        display: none;
        padding: 10px 0;
    }
    .custom-tabs .tab-content .tab-pane.active {
        display: block;
    }

    /* CNC工艺设计样式 */
    .cnc-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100%;
    }
    .cnc-modal-header-title {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
    }
    .cnc-modal-header-buttons {
        display: flex;
        gap: 8px;
    }
    .cnc-process-card {
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        margin-bottom: 15px;
        background: white;
    }
    .cnc-process-header {
        background: #f5f7fa;
        padding: 12px 15px;
        border-bottom: 1px solid #ebeef5;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .cnc-process-body {
        padding: 15px;
    }
    .cnc-step-item {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        padding: 8px;
        background: #f8f9fa;
        border-radius: 4px;
    }
    .cnc-step-number {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #409EFF;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-right: 10px;
    }
    .cnc-step-content {
        flex: 1;
    }
    .cnc-machining-params {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        margin-top: 8px;
    }
    .cnc-machining-param-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .cnc-machining-param-item input {
        width: 100%;
        padding: 4px 8px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        font-size: 12px;
    }
    .cnc-machining-param-item label {
        font-size: 11px;
        color: #666;
        margin: 0;
    }
    .cnc-step-actions {
        display: flex;
        gap: 5px;
    }

</style>
<div class="container">
    <div class="product-list-page" style="display: flex;">
        {% csrf_token %}
        <!-- 左侧筛选栏 -->
        <aside id="main-filter" style="width:280px; margin-right:30px; border-right:1px solid #ddd; padding-right:20px; box-sizing:border-box;">
            <div class="filter-block" style="margin-bottom:24px;">
                <h4>选择产品订单</h4>
                <table id="product-order-table" class="table_pagination"
                    data-headers='["订单号","产品","批次"]'
                    data-keys='["order_id","product_id","lot_id"]'>
                </table>
            </div>
            <div class="filter-block">
                <h4>零件编码</h4>
                <input type="text" id="material_number" name="material_number" placeholder="搜索零件编码" style="width:90%;">
            </div>
            <div class="filter-block">
                <h4>零件型号</h4>
                <input type="text" id="material_model" name="material_model" placeholder="搜索零件型号" style="width:90%;">
            </div>
            <div class="filter-block">
                <h4>状态</h4>
                <input type="text" id="status" name="status" placeholder="搜索零件订单状态" style="width:90%;">
            </div>
            <div style="text-align:right;margin-top:16px;">
                <button id="filter-confirm-btn" class="el-button el-button--primary el-button--small">确认过滤条件</button>
            </div>
        </aside>

        <main style="flex:1;" id="order-filter-result">
            <div style="margin-bottom:10px;">
                <span style="font-weight:bold;font-size:16px;">订单零件明细</span>
            </div>
            <div id="filter-detail" style="margin:12px 0;color:#666;font-size:13px;">
                当前过滤条件：
                <span id="filter-detail-content">无</span>
            </div>
            <table id="product-parts-table" class='data-table' data-page=1 data-limit=20>
            </table>

        </main>
    </div>

    <!-- 零件详情查询框 -->
    <div id="parts-detail-modal" class="modal" >
        <header class="el-header" style="height: 5vh;">
            <div class="fx-modal-header" style="display: flex; align-items: center; justify-content: space-between;">
                <div class="header-title" style="margin-right: 16px;">
                <div class="title-text" id="parts-detail-modal-title" title="title-text" style="font-size: 20px; font-weight: bold;"></div>
            </div>
            <div class="modal-controls" style="display: flex; align-items: center; gap: 8px;">
                <div class="el-button-group btn-group" size="small">
                    <button type="button" id="maximize-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                        ⛶</button>
                    <button type="button" id="switch-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                        <span class="el-icon-switch-button"></span>
                    </button>
                </div>
            </div>
        </div>

        </header> 
        <footer class="el-footer" style="height: 5vh;">
            <hr style="border-bottom:1px solid #e4e7ed; margin: 12px 0; height: 0;" aria-hidden="true">
            <div class="fx-data-menu" style="display: flex; align-items: center; gap: 24px; justify-content: space-between;">
                <div class="button-pane">
                    <div class="el-button-group btn-group" size="small">
                        <button type="button" id="modal_printer" class="el-icon-printer" style="cursor: pointer">
                        </button>
                        <button type="button" id="modal_edit" class="el-icon-edit" style="cursor: pointer">
                        </button>
                        <button type="button" id="modal_delete" class="el-icon-delete" style="cursor: pointer">
                        </button>
                    </div>
                </div>
                <div class="switch-pane fx-data-switch" style="display: flex; align-items: center; gap: 8px;">
                    <button class="switch-btn active" aria-label="Previous"></button>
                    <div class="switch-index">2/6</div>
                    <button class="switch-btn active" aria-label="Next"></button>
                </div>
            </div>
            <hr style="border-bottom:1px solid #e4e7ed; margin: 12px 0; height: 0;" aria-hidden="true">
        </footer>
        <main class="el-main" style="max-height: 70vh; overflow-y: auto;">
            <div id="parts-descriptions-order" class='el-descriptions' data-title="订单信息"></div>
            <div id="parts-descriptions-wuliao" class='el-descriptions' data-title="零件信息"></div>
            <div id="parts-descriptions-subparts" class='el-descriptions' data-title="中间件信息"  data-body="table"></div>
            <div id="parts-descriptions-chanshu" class='el-descriptions' data-title="规格参数"></div>
            <div id="parts-descriptions-gongyi" class='el-descriptions' data-title="工艺线路" data-has-hide-swc="true" data-body="table"> </div>
            <div id="parts-descriptions-cnc-gongyi" class='el-descriptions' data-title="CNC工艺设计" data-has-hide-swc="true" data-body="table"></div>
        </main> 
    </div>
    <div id="parts-detail-modal-overlay" class="modal-overlay"></div>

    <die id="process-design-modal" class="modal">
        <div class="el-dialog__header" style="height: 60px;">
        <span class="el-dialog__title">工序设计</span>
        </div>
        <hr style="border-bottom:1px solid #e4e7ed; margin: 12px 0; height: 0;" aria-hidden="true">
        <div class="el-dialog__body" style="max-height: 60vh; overflow-y: auto;">
            <!-- 1.工序组选择 -->
            <div style="margin-bottom: 15px;">
            <label>工序组：</label>
            <select id="select-step-group" class="el-select__inner">
                <option value="" >请选择工序组</option>
                {% for column in StepGroup %}
                    <option value={{column.label}} >{{column.label}}</option>
                {% endfor %}
            </select>
            </div>

            <!-- 2.工序选择与排序 -->
            <div class="transfer-container"  style="display: flex; align-items: center; ">
                <div class="transfer-panel" id="step-before-select">                    
                    <div class="el-transfer-panel__header">可选工序</div>
                    <div id="available-steps" class="el-transfer-panel__body" style="border:1px solid #ddd; overflow-y: auto;"></div>
                </div>
                <div class="sort-buttons"></div>
                <div class="transfer-panel" id="step-after-select">
                    <div class="el-transfer-panel__header">已选工序</div>
                    <div id="selected-steps" class="el-transfer-panel__body" style="border:1px solid #ddd; overflow-y: auto;" ></div>
                </div>
            </div>

            <!-- 3.工艺参数设置 -->
            <div style="margin: 20px 0;" id="step-params-set">
            <table class="el-table" >
                <table class="el-table__header" width="100%" id="param-table"
                    data-headers='["工序名称","工艺参数"]' data-keys='["name","params"]' data-inputs='["params"]'>        
                </table>
            </table>
            <div class="el-table__body-wrapper"></div>
            </div>

            <!-- 4.备注输入 -->
            <div style="margin: 15px 0;">
            <label>备注：</label>
            <textarea id="remark" class="el-textarea__inner" rows="3"></textarea>
            </div>

            <!-- 5.确认按钮 -->
            <div style="text-align: right;">
            <button class="el-button" id="close-step-design-modal">取消</button>
            <button class="el-button el-button--primary" id="load-step-design">确认</button>
            </div>
        </div>
    </div>
    <div id="process-design-modal-overlay" class="modal-overlay"></div>

    <!-- CNC工艺设计模态框 -->
    <div id="cnc-design-modal" class="modal">
        <div class="el-dialog__header cnc-modal-header" style="height: 5vh;">
            <h2 class="cnc-modal-header-title">CNC工艺设计</h2>
            <div class="modal-controls" style="display: flex; align-items: center; gap: 8px;">
                <div class="el-button-group btn-group" size="small">
                    <button type="button" id="maximize-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                        ⛶</button>
                    <button type="button" id="switch-modal" class="el-button el-button--default el-button--small" style="cursor: pointer">
                        <span class="el-icon-switch-button"></span>
                    </button>
                </div>
            </div>
        </div>
        <hr style="border-bottom:1px solid #e4e7ed; margin: 12px 0; height: 0;" aria-hidden="true">

        <div class="el-dialog__body" style="max-height: 65vh; overflow-y: auto; padding: 20px;">
            <!-- 基础信息展示 -->
            <div id="cnc-basic-info" style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px;">
                <h3 style="margin: 0 0 10px 0; color: #409EFF;">基础信息</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <div><strong>订单号:</strong> <span id="cnc-order-id"></span></div>
                    <div><strong>零件编码:</strong> <span id="cnc-material-number"></span></div>
                    <div><strong>零件型号:</strong> <span id="cnc-material-model"></span></div>
                    <div><strong>零件版本:</strong> <span id="cnc-version"></span></div>
                    <div><strong>工艺版本:</strong> <span id="cnc-version"></span></div>
                </div>
            </div>

            <!-- CNC工序卡管理 -->
            <div style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: #409EFF;">CNC工序卡</h3>
                    <button id="add-cnc-process" class="el-button el-button--primary el-button--small">
                        <i class="el-icon-plus"></i> 添加工序卡
                    </button>
                </div>

                <div id="cnc-processes-container">
                    <!-- 动态添加的工序卡 -->
                </div>
            </div>

            <!-- 操作按钮 -->
            <div style="text-align: right; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ebeef5;">
                <button class="el-button el-button--small" id="cancel-cnc-design">取消</button>
                <button class="el-button el-button--primary el-button--small" id="save-cnc-design">保存设计</button>
            </div>
        </div>
    </div>
    <div id="cnc-design-modal-overlay" class="modal-overlay"></div>
</div>

<script type="module">
    import {postTableRenderer} from "{% static 'js/renderFrame.js' %}";
    import {
        handleProcessEditModalEvent,
        handlePartDetailModalEvent,
        handleCNCDesignModalEvent
    } from "{% static 'js/ui_pmcui.js' %}";
    import {
        handleOrderPartFilterEvent,
        handlePartsTableSelectEvent,
    } from "{% static 'js/c_gongyi.js' %}";

    import{
        renderTableAndLoadData,
        handleTableEvent,
    } from "{% static 'js/eventAction.js' %}";
    import {API_CONFIG} from "{% static 'js/apiConfig.js' %}";
    // 全局变量

    document.addEventListener('DOMContentLoaded', function() {
        const ordertable = document.getElementById('product-order-table')
        ordertable.dataset.url = JSON.stringify(API_CONFIG['b_jihua'].order)
        renderTableAndLoadData(ordertable);
        const partstable = document.getElementById('product-parts-table');
        partstable.dataset.headers = JSON.stringify(["零件编码","零件名称","规格型号","版本信息", "生产单位","数量", "计划截止","状态"])
        partstable.dataset.keys = JSON.stringify(["id","order_id","material_id", "material_number","material_name","material_model","version","route","quantity","deadline","status"])
        partstable.dataset.hidkeys = JSON.stringify(["id","order_id","material_id"])       
        //partstable.dataset.selects = JSON.stringify({version:{key:'history_versions'}})
        partstable.dataset.url = JSON.stringify(API_CONFIG['d_paichan'].get_order_parts)
        const parts_detail_modal = document.getElementById('parts-detail-modal');
        handleOrderPartFilterEvent(document.getElementById('main-filter'), partstable);
        //handleTableEvent(document.getElementById('order-filter-result'))

        handlePartsTableSelectEvent(partstable, parts_detail_modal);
        handlePartDetailModalEvent(parts_detail_modal);

        handleProcessEditModalEvent(document.getElementById('process-design-modal'))

        handleCNCDesignModalEvent(document.getElementById('cnc-design-modal'))
        
    });
</script>
{% endblock %}
